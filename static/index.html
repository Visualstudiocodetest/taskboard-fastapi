<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TaskBoard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f3f4f8; --card: #fff; --text: #1f2430; --muted: #8a90a2; --line: #e6e8ef;
    --accent: #5b6cf0; --accent-dark: #4656d6; --danger: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161d; --card: #1e212b; --text: #e8eaf1; --muted: #8b91a5; --line: #2e3240; }
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text);
         max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
  h1 { margin: 0 0 1rem; font-size: 1.8rem; color: var(--accent); letter-spacing: -.02em; }
  h2 { margin: 0 0 1rem; font-size: 1.05rem; }
  .cols { display: flex; gap: 1.25rem; flex-wrap: wrap; align-items: flex-start; }
  .cols > div { flex: 1; min-width: 280px; background: var(--card); border: 1px solid var(--line);
                border-radius: 14px; padding: 1.25rem; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  form { display: flex; gap: .5rem; margin-bottom: 1rem; }
  form[hidden] { display: none; }
  input[type=text], input:not([type]), select { flex: 1; min-width: 0; padding: .55rem .7rem; font: inherit; color: inherit;
         background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  select { flex: 0 0 auto; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { padding: .5rem .9rem; font: inherit; font-weight: 600; color: #fff; background: var(--accent);
           border: 0; border-radius: 8px; cursor: pointer; transition: background .15s; }
  button:hover { background: var(--accent-dark); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: .6rem; padding: .6rem .7rem; margin-bottom: .4rem;
       border: 1px solid var(--line); border-radius: 10px; transition: border-color .15s; }
  li:hover { border-color: var(--accent); }
  li.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  li > a, li > span { flex: 1; }
  li a { color: inherit; text-decoration: none; }
  li.sel > a { font-weight: 600; }
  li button { padding: .2rem .5rem; font-weight: 400; color: var(--muted); background: transparent; }
  li button:hover { color: #fff; background: var(--danger); }
  input[type=checkbox] { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); cursor: pointer; }
  .done span { text-decoration: line-through; color: var(--muted); }
  #err { min-height: 1.4rem; margin-bottom: .75rem; color: var(--danger); font-weight: 500; }
  #projects:empty::after, #tasks:empty::after { content: "Nothing here yet."; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<h1>TaskBoard</h1>
<div id="err"></div>
<div class="cols">
  <div>
    <h2>Projects</h2>
    <form id="pf"><input id="pname" placeholder="New project" required> <button>Add</button></form>
    <ul id="projects"></ul>
  </div>
  <div>
    <h2 id="ptitle">Tasks</h2>
    <form id="tf" hidden>
      <input id="ttitle" placeholder="New task" required>
      <select id="tprio"><option value="1">High</option><option value="2" selected>Normal</option><option value="3">Low</option></select>
      <button>Add</button>
    </form>
    <ul id="tasks"></ul>
  </div>
</div>
<script>
let current = null;
const $ = id => document.getElementById(id);

async function api(url, method = "GET", body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    const d = e.detail;
    $("err").textContent = Array.isArray(d) ? d.map(x => x.loc.slice(1).join(".") + ": " + x.msg).join("; ") : (d || r.statusText);
    throw new Error("api");
  }
  $("err").textContent = "";
  return r.status === 204 ? null : r.json();
}
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };

async function loadProjects() {
  const ul = $("projects"); ul.innerHTML = "";
  for (const p of await api("/api/projects")) {
    const li = el("li", { className: p.id === current?.id ? "sel" : "" });
    const a = el("a", { href: "#", textContent: `${p.name} (${p.task_count})` });
    a.onclick = e => { e.preventDefault(); current = p; refresh(); };
    const del = el("button", { textContent: "✕", title: "Delete project" });
    del.onclick = async () => { if (confirm(`Delete "${p.name}" and its tasks?`)) {
      await api(`/api/projects/${p.id}`, "DELETE"); if (current?.id === p.id) current = null; refresh(); } };
    li.append(a, " ", del); ul.append(li);
  }
}
async function loadTasks() {
  const ul = $("tasks"); ul.innerHTML = "";
  $("tf").hidden = !current;
  $("ptitle").textContent = current ? `Tasks – ${current.name}` : "Tasks";
  if (!current) return;
  for (const t of await api(`/api/projects/${current.id}/tasks`)) {
    const li = el("li", { className: t.done ? "done" : "" });
    const cb = el("input", { type: "checkbox", checked: t.done });
    cb.onchange = async () => { await api(`/api/tasks/${t.id}`, "PATCH", { done: cb.checked }); refresh(); };
    const del = el("button", { textContent: "✕" });
    del.onclick = async () => { await api(`/api/tasks/${t.id}`, "DELETE"); refresh(); };
    li.append(cb, " ", el("span", { textContent: `${["", "🔴", "🟡", "🟢"][t.priority]} ${t.title}` }), " ", del);
    ul.append(li);
  }
}
const refresh = () => Promise.all([loadProjects(), loadTasks()]).catch(() => {});
$("pf").onsubmit = async e => { e.preventDefault();
  try { current = await api("/api/projects", "POST", { name: $("pname").value }); $("pname").value = ""; refresh(); } catch {} };
$("tf").onsubmit = async e => { e.preventDefault();
  try { await api(`/api/projects/${current.id}/tasks`, "POST", { title: $("ttitle").value, priority: +$("tprio").value });
    $("ttitle").value = ""; refresh(); } catch {} };
refresh();
</script>
</body>
</html>
